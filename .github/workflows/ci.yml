name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_OWNER_URL: postgres://postgres:postgres@localhost:5432/ledgerline
      APP_SERVER_PASSWORD: ci_app_server_password_for_tests_only
      APP_DATABASE_URL: postgres://app_server:ci_app_server_password_for_tests_only@localhost:5432/ledgerline
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-auth-secret
      GATE_COOKIE_SECRET: ci-gate-secret-ci-gate-secret-ci-gate-secret
      GATE_PASSCODE: ci-passcode
      DEMO_TODAY: "2026-10-14"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:role
      - run: pnpm db:seed
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit, SQL and eval tests
        run: pnpm test --reporter=default --reporter=json --outputFile.json=reports/vitest.json
      - run: pnpm build
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: End to end tests
        run: pnpm e2e
      - name: Requirements evidence
        if: always()
        run: pnpm tsx scripts/trust.ts
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: evidence
          path: |
            reports
            !reports/auth
            app/trust/evidence.json
      - name: Deploy the tested build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
